name: vellum_app
description: 素笺（Vellum）个人私有生活记录与 AI 状态分析 Android 客户端
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0
  flutter_svg: ^2.0.17
  flutter_markdown_plus: ^1.0.3
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  photo_view: ^0.15.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  local_auth: ^2.3.0
  geolocator: ^13.0.2
  connectivity_plus: ^6.1.3
  file_picker: ^8.3.1
  share_plus: ^10.1.4
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/demo/
    - assets/data/
