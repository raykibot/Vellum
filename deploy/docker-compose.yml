services:
  postgres:
    image: postgres:16-alpine
    container_name: vellum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vellum}
      POSTGRES_USER: ${POSTGRES_USER:-vellum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vellum_dev_pwd}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vellum_pg_data:/var/lib/postgresql/data
      - ../vellum-server/src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vellum} -d ${POSTGRES_DB:-vellum}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: vellum-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vellum}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vellum_minio_pwd}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - vellum_minio_data:/data

volumes:
  vellum_pg_data:
  vellum_minio_data:
